name: Run targeted tests

on:
  push:
    branches: ["main", "master", "rama"]
  pull_request:
    branches: ["main", "master", "rama"]

jobs:
  jest-targeted:
    name: Run targeted Jest tests (test/)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run targeted tests
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/test
        run: npm test -- --testPathPattern="test" --runInBand
